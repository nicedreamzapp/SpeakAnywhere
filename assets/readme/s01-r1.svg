<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="Dictate. Tap the mic and talk. Your words are typed into whatever window has focus. Listen. Copy any text, tap Speak Clipboard, hear it in a natural neural voice. Stay private. Every model runs locally. After the one-time model download, nothing goes over the network."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7f7a"/><stop offset="1" stop-color="#3f6f8a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="264.3" height="133" rx="10"/></clipPath><rect width="264.3" height="133" rx="10" fill="url(#n)"/><rect width="264.3" height="4" fill="#2f7f7a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="263.3" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="134" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#c4dbd9">Dictate</text><text x="134" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Tap the mic and talk. Your</text><text x="134" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">words are typed into</text><text x="134" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">whatever window has focus.</text></g><g transform="translate(276.3,0)"><clipPath id="c0_1"><rect width="237.0" height="133" rx="10"/></clipPath><rect width="237.0" height="133" rx="10" fill="url(#n)"/><rect width="237.0" height="4" fill="#2f7f7a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="236.0" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="120" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#c4dbd9">Listen</text><text x="120" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Copy any text, tap Speak</text><text x="120" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">Clipboard, hear it in a</text><text x="120" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">natural neural voice.</text></g><g transform="translate(525.3,0)"><clipPath id="c0_2"><rect width="294.7" height="133" rx="10"/></clipPath><rect width="294.7" height="133" rx="10" fill="url(#n)"/><rect width="294.7" height="4" fill="#2f7f7a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="293.7" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="149" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#c4dbd9">Stay private</text><text x="149" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Every model runs locally. After</text><text x="149" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">the one-time model download,</text><text x="149" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">nothing goes over the network.</text></g></g></svg>
