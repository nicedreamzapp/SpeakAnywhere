<svg xmlns="http://www.w3.org/2000/svg" width="820" height="109" viewBox="0 0 820 109" role="img" aria-label="Reader. Starts talking on the first sentence. Dictation. Silero decides what is speech, decoding runs off the audio thread. Nothing lost. Switching dictation off drains the queue first."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7a4a"/><stop offset="1" stop-color="#3f6f5a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="239.7" height="109" rx="10"/></clipPath><rect width="239.7" height="109" rx="10" fill="url(#n)"/><rect width="239.7" height="4" fill="#4f7a4a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="238.7" height="108" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="122" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cdd9cc">Reader</text><text x="122" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Starts talking on the first</text><text x="122" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">sentence</text></g><g transform="translate(251.7,0)"><clipPath id="c0_1"><rect width="316.6" height="109" rx="10"/></clipPath><rect width="316.6" height="109" rx="10" fill="url(#n)"/><rect width="316.6" height="4" fill="#4f7a4a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="315.6" height="108" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="160" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cdd9cc">Dictation</text><text x="160" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Silero decides what is speech,</text><text x="160" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">decoding runs off the audio thread</text></g><g transform="translate(580.3,0)"><clipPath id="c0_2"><rect width="239.7" height="109" rx="10"/></clipPath><rect width="239.7" height="109" rx="10" fill="url(#n)"/><rect width="239.7" height="4" fill="#4f7a4a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="238.7" height="108" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="122" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cdd9cc">Nothing lost</text><text x="122" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Switching dictation off</text><text x="122" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">drains the queue first</text></g></g></svg>
