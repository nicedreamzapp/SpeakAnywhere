<svg xmlns="http://www.w3.org/2000/svg" width="560" height="237" viewBox="0 0 560 237" role="img" aria-label="Dictate. Tap the mic and talk. Your words are typed into whatever window has focus. Listen. Copy any text, tap Speak Clipboard, hear it in a natural neural voice. Stay private. Every model runs locally. After the one-time model download, nothing goes over the network."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7f7a"/><stop offset="1" stop-color="#3f6f8a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="275.0" height="125" rx="10"/></clipPath><rect width="275.0" height="125" rx="10" fill="url(#n)"/><rect width="275.0" height="4" fill="#2f7f7a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="274.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="140" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#c4dbd9">Dictate</text><text x="140" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Tap the mic and talk. Your</text><text x="140" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">words are typed into whatever</text><text x="140" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">window has focus.</text></g><g transform="translate(285.0,0)"><clipPath id="c0_1"><rect width="275.0" height="125" rx="10"/></clipPath><rect width="275.0" height="125" rx="10" fill="url(#n)"/><rect width="275.0" height="4" fill="#2f7f7a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="274.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="140" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#c4dbd9">Listen</text><text x="140" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Copy any text, tap Speak</text><text x="140" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">Clipboard, hear it in a natural</text><text x="140" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">neural voice.</text></g><g transform="translate(0.0,135)"><clipPath id="c1_0"><rect width="560.0" height="102" rx="10"/></clipPath><rect width="560.0" height="102" rx="10" fill="url(#n)"/><rect width="560.0" height="4" fill="#2f7f7a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#c4dbd9">Stay private</text><text x="282" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Every model runs locally. After the one-time model download, nothing</text><text x="282" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">goes over the network.</text></g></g></svg>
